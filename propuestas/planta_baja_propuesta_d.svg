<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 820" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <pattern id="wood" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#78350f" opacity="0.15"/>
      <line x1="0" y1="5" x2="20" y2="5" stroke="#b45309" stroke-width="1" opacity="0.3"/>
      <line x1="0" y1="15" x2="20" y2="15" stroke="#b45309" stroke-width="1" opacity="0.3"/>
    </pattern>
    <pattern id="grass" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#064e3b" opacity="0.2"/>
      <circle cx="15" cy="15" r="2" fill="#10b981" opacity="0.4"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- CUADRÍCULA DE FONDO (1m = 40px) -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- CAPA: PARCELA Y RETRANQUEOS -->
  <g id="parcela-y-retranqueos">
    <!-- Límite visual de parcela -->
    <rect x="40" y="30" width="840" height="760" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="50" y="55" fill="#64748b" font-size="12" font-weight="600">PARCELA OBJETIVO 600 m² (20 × 30 m) — LIÁNS / SANTA CRUZ (OLEIROS)</text>
    
    <!-- Retranqueo frontal Norte 5m -->
    <line x1="40" y1="70" x2="880" y2="70" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
    <text x="730" y="65" fill="#ef4444" font-size="11">Retranqueo Norte 5,00 m (PXOM)</text>
  </g>

  <!-- JARDÍN Y PATIO -->
  <g id="jardin-y-exteriores">
    <!-- Jardín Sur -->
    <rect x="140" y="620" width="620" height="150" fill="url(#grass)"/>
    
    <!-- Patio Claustro Atlántico (Cielo Abierto) -->
    <rect x="440" y="220" width="160" height="160" fill="#022c22" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 2"/>
    <circle cx="520" cy="300" r="45" fill="#065f46" opacity="0.4"/>
    <circle cx="520" cy="300" r="30" fill="#047857" opacity="0.6"/>
    <!-- Arce Japonés -->
    <circle cx="520" cy="300" r="14" fill="#f43f5e" opacity="0.8"/>
    <text x="520" y="304" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">ARCE</text>
    <text x="520" y="245" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">PATIO CLAUSTRO (16 m²)</text>
    <text x="520" y="260" fill="#94a3b8" font-size="9" text-anchor="middle">Abierto al cielo · Drenante</text>
  </g>

  <!-- CAPA: PORCHE SUR Y PÉRGOLA -->
  <g id="porche-y-pergola">
    <!-- Pérgola 2 Coches Norte -->
    <rect x="120" y="80" width="160" height="240" fill="#1e293b" opacity="0.7" stroke="#475569" stroke-width="2" stroke-dasharray="6 3"/>
    <text x="200" y="160" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">PÉRGOLA 2 VEHÍCULOS</text>
    <text x="200" y="180" fill="#38bdf8" font-size="10" text-anchor="middle">⚡ Wallbox EV 7,4 kW</text>
    <!-- Siluetas coches -->
    <rect x="135" y="110" width="60" height="110" rx="8" fill="#334155" opacity="0.5"/>
    <rect x="205" y="110" width="60" height="110" rx="8" fill="#334155" opacity="0.5"/>

    <!-- Porche Cubierto Sur (Fondo ampliado a 3,00 m = 120px) -->
    <rect x="280" y="540" width="480" height="120" fill="url(#wood)" stroke="#b45309" stroke-width="1.5"/>
    <text x="440" y="650" fill="#fbbf24" font-size="11" font-weight="600">PORCHE SUR EXPANDIDO (FONDO 3,00 m — 36 m² CUBIERTOS)</text>
    
    <!-- Mesa Comedor Exterior 10 Pax en Porche -->
    <rect x="490" y="560" width="130" height="45" rx="4" fill="#78350f" stroke="#d97706" stroke-width="1.5"/>
    <text x="555" y="587" fill="#fef3c7" font-size="10" font-weight="600" text-anchor="middle">Mesa Exterior (10 Pax)</text>

    <!-- Barbacoa Churrasqueira en muro Este -->
    <rect x="710" y="550" width="50" height="80" fill="#b91c1c" stroke="#f87171" stroke-width="1.5"/>
    <text x="735" y="585" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">CHURRASQ.</text>
    <text x="735" y="600" fill="#fee2e2" font-size="8" text-anchor="middle">Carbón</text>

    <!-- Cuarto de Herramientas + Robot en lateral Oeste -->
    <rect x="200" y="470" width="80" height="70" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="240" y="500" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle">JARDÍN &amp; ROBOT</text>
    <text x="240" y="515" fill="#38bdf8" font-size="8" text-anchor="middle">Salida directa</text>
  </g>

  <!-- CAPA: MUROS EXTERIORES (Espesor 38 cm = 15 px) -->
  <g id="muros-exteriores" filter="url(#shadow)">
    <!-- Perímetro Principal en U -->
    <path d="
      M 280 80 
      L 760 80 
      L 760 540 
      L 280 540 
      L 280 320 
      L 120 320 
      L 120 470 
      L 280 470 
      Z" 
      fill="#1e293b" stroke="#0ea5e9" stroke-width="3"/>

    <!-- Vaciado del Claustro Interior -->
    <rect x="440" y="220" width="160" height="160" fill="#0f172a" stroke="#0ea5e9" stroke-width="3"/>
  </g>

  <!-- CAPA: TABIQUERÍA INTERIOR (10-12 cm = 5 px) -->
  <g id="tabiqueria-interior">
    <!-- Muro separador Zaguán / Trastero -->
    <line x1="280" y1="200" x2="360" y2="200" stroke="#475569" stroke-width="4"/>
    <!-- Muro separador Hall / Despacho -->
    <line x1="460" y1="80" x2="460" y2="220" stroke="#475569" stroke-width="5"/>
    <!-- Muro separador Despacho / Núcleo Baño -->
    <line x1="600" y1="80" x2="600" y2="220" stroke="#475569" stroke-width="5"/>
    <!-- Muro separador Baño / Distribuidor neutro -->
    <line x1="600" y1="180" x2="745" y2="180" stroke="#475569" stroke-width="4"/>
    <!-- Muro separador Escalera / Salón -->
    <line x1="280" y1="380" x2="440" y2="380" stroke="#475569" stroke-width="5"/>
    <!-- Muro separador Cocina / Lavandería -->
    <line x1="660" y1="380" x2="760" y2="380" stroke="#475569" stroke-width="4"/>
  </g>

  <!-- CAPA: CARPINTERÍAS Y ACRISTALAMIENTOS -->
  <g id="carpinterias">
    <!-- Claustro: 4 grandes paños acristalados Cortizo Cor Vision Plus -->
    <line x1="440" y1="220" x2="600" y2="220" stroke="#38bdf8" stroke-width="4" opacity="0.9"/>
    <line x1="600" y1="220" x2="600" y2="380" stroke="#38bdf8" stroke-width="4" opacity="0.9"/>
    <line x1="600" y1="380" x2="440" y2="380" stroke="#38bdf8" stroke-width="4" opacity="0.9"/>
    <line x1="440" y1="380" x2="440" y2="220" stroke="#38bdf8" stroke-width="4" opacity="0.9"/>

    <!-- Ventanales Sur de Salón y Comedor (Correderas empotradas) -->
    <line x1="290" y1="540" x2="450" y2="540" stroke="#38bdf8" stroke-width="5"/>
    <line x1="470" y1="540" x2="740" y2="540" stroke="#38bdf8" stroke-width="5"/>

    <!-- Ventanal Esquina Suroeste del Salón -->
    <line x1="280" y1="460" x2="280" y2="540" stroke="#38bdf8" stroke-width="5"/>
    
    <!-- Ventana Norte Despacho (Legalidad NHG) -->
    <line x1="490" y1="80" x2="570" y2="80" stroke="#38bdf8" stroke-width="4"/>
    <text x="530" y="72" fill="#38bdf8" font-size="8" text-anchor="middle">Ventana Norte (NHG)</text>

    <!-- Puerta Entrada Principal en Mudroom -->
    <path d="M 330 80 A 35 35 0 0 1 365 115" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <line x1="330" y1="80" x2="330" y2="115" stroke="#f59e0b" stroke-width="2.5"/>

    <!-- Puerta Noble Despacho (Acústica) -->
    <path d="M 460 170 A 35 35 0 0 0 495 205" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <line x1="460" y1="170" x2="495" y2="170" stroke="#f59e0b" stroke-width="2.5"/>
  </g>

  <!-- CAPA: ESTANCIAS Y MOBILIARIO REGLAMENTARIO (NHG) -->
  <g id="mobiliario-nhg">
    <!-- 1. ZAGUÁN ATLÁNTICO / MUDROOM -->
    <rect x="285" y="85" width="70" height="110" fill="#0369a1" opacity="0.15"/>
    <rect x="290" y="90" width="60" height="25" rx="3" fill="#0284c7" opacity="0.4"/>
    <text x="320" y="107" fill="#bae6fd" font-size="9" text-anchor="middle">Zapatero</text>
    <text x="320" y="140" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">ZAGUÁN</text>
    <text x="320" y="153" fill="#94a3b8" font-size="8" text-anchor="middle">Mudroom 5,8 m²</text>
    <text x="320" y="165" fill="#22c55e" font-size="8" text-anchor="middle">🔒 Esclusa Térmica</text>

    <!-- 2. HALL PRINCIPAL -->
    <text x="400" y="145" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">HALL</text>
    <text x="400" y="160" fill="#94a3b8" font-size="9" text-anchor="middle">10,2 m²</text>
    <rect x="365" y="90" width="40" height="20" fill="#334155"/>
    <text x="385" y="103" fill="#cbd5e1" font-size="7" text-anchor="middle">Gabanero</text>

    <!-- 3. DESPACHO SANCTASANCTÓRUM (SUITE VISITAS) -->
    <rect x="465" y="85" width="130" height="130" fill="#0f172a"/>
    <!-- Mesa de teletrabajo ergonómica -->
    <rect x="480" y="110" width="75" height="35" rx="3" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="517" cy="155" r="10" fill="#475569"/>
    <!-- Sofá-cama visitas -->
    <rect x="560" y="110" width="35" height="70" rx="3" fill="#1e293b" stroke="#cbd5e1" stroke-width="1"/>
    <text x="530" y="180" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">DESPACHO / SUITE</text>
    <text x="530" y="195" fill="#94a3b8" font-size="9" text-anchor="middle">11,8 m² · Sanctasanctórum</text>
    <text x="530" y="207" fill="#10b981" font-size="8" text-anchor="middle">✓ Doble orientación y luz</text>

    <!-- 4. NÚCLEO BAÑO PB & VESTÍBULO -->
    <rect x="605" y="85" width="150" height="90" fill="#0c4a6e" opacity="0.2"/>
    <!-- Ducha Walk-in -->
    <rect x="705" y="85" width="50" height="35" fill="#0284c7" opacity="0.4"/>
    <text x="730" y="107" fill="#ffffff" font-size="8" text-anchor="middle">Ducha</text>
    <!-- Inodoro -->
    <rect x="670" y="90" width="20" height="25" rx="5" fill="#e2e8f0"/>
    <!-- Lavabo suspendido -->
    <rect x="615" y="90" width="35" height="20" rx="2" fill="#e2e8f0"/>
    <text x="680" y="150" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">BAÑO PB (5,4 m²)</text>
    <text x="680" y="163" fill="#22c55e" font-size="8" text-anchor="middle">✓ Legal NHG · Sin paso a cocina</text>
    <!-- Distribuidor neutro -->
    <text x="680" y="203" fill="#94a3b8" font-size="9" text-anchor="middle">Distribuidor Neutro</text>

    <!-- 5. ESCALERA (NORTE A SUR) -->
    <g id="escalera">
      <rect x="360" y="220" width="75" height="155" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <!-- Peldaños -->
      <line x1="360" y1="235" x2="435" y2="235" stroke="#475569" stroke-width="1"/>
      <line x1="360" y1="250" x2="435" y2="250" stroke="#475569" stroke-width="1"/>
      <line x1="360" y1="265" x2="435" y2="265" stroke="#475569" stroke-width="1"/>
      <line x1="360" y1="280" x2="435" y2="280" stroke="#475569" stroke-width="1"/>
      <line x1="360" y1="295" x2="435" y2="295" stroke="#475569" stroke-width="1"/>
      <line x1="360" y1="310" x2="435" y2="310" stroke="#475569" stroke-width="1"/>
      <line x1="360" y1="325" x2="435" y2="325" stroke="#475569" stroke-width="1"/>
      <line x1="360" y1="340" x2="435" y2="340" stroke="#475569" stroke-width="1"/>
      <line x1="360" y1="355" x2="435" y2="355" stroke="#475569" stroke-width="1"/>
      <!-- Flecha de subida -->
      <line x1="397" y1="230" x2="397" y2="360" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="397" y="300" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">SUBE A P1</text>
    </g>

    <!-- 6. COCINA CON ISLA Y DESAYUNADOR -->
    <rect x="605" y="225" width="150" height="150" fill="#1e293b" opacity="0.3"/>
    <!-- Isla 3,00 × 1,05 m (120 × 42 px) -->
    <rect x="620" y="260" width="120" height="42" rx="3" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="680" y="285" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">ISLA DEKTON 3,00 m</text>
    <!-- Placa Bora integrada -->
    <rect x="635" y="270" width="25" height="22" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
    <!-- Mueble columnas al Este -->
    <rect x="745" y="225" width="12" height="150" fill="#475569"/>
    <text x="680" y="330" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">COCINA CON ISLA</text>
    <text x="680" y="345" fill="#94a3b8" font-size="9" text-anchor="middle">16,8 m² · Vistas al Claustro</text>

    <!-- 7. LAVANDERÍA Y TÉCNICO -->
    <rect x="665" y="385" width="90" height="85" fill="#1e293b"/>
    <rect x="715" y="390" width="35" height="35" fill="#475569"/>
    <text x="732" y="410" fill="#ffffff" font-size="7" text-anchor="middle">Columna</text>
    <text x="732" y="418" fill="#bae6fd" font-size="6" text-anchor="middle">Lav+Sec</text>
    <text x="705" y="450" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle">LAVANDERÍA (6,0 m²)</text>

    <!-- 8. SALÓN - COMEDOR PANORÁMICO -->
    <rect x="285" y="385" width="375" height="150" fill="#0f172a"/>
    <!-- Sofá modular en L -->
    <path d="M 305 405 L 375 405 L 375 465 L 345 465 L 345 435 L 305 435 Z" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <text x="340" y="435" fill="#cbd5e1" font-size="9" text-anchor="middle">Sofá L</text>
    <!-- Mesa de centro -->
    <rect x="315" y="445" width="40" height="25" rx="3" fill="#475569"/>
    <!-- Muro Oeste: Chimenea y TV 77" -->
    <rect x="285" y="410" width="8" height="60" fill="#ef4444"/>
    <text x="298" y="445" fill="#fca5a5" font-size="8" transform="rotate(-90 298 445)" text-anchor="middle">TV 77" + Chimenea</text>
    <text x="365" y="505" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">SALÓN PRINCIPAL (28,5 m²)</text>
    <text x="365" y="520" fill="#38bdf8" font-size="9" text-anchor="middle">Ventanal en esquina Suroeste</text>

    <!-- Comedor Principal Interior (10 Plazas) -->
    <rect x="500" y="420" width="130" height="48" rx="4" fill="#334155" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="565" y="448" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">COMEDOR INTERIOR (10 Pax)</text>
    <text x="565" y="505" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">COMEDOR (18,2 m²)</text>
    <text x="565" y="520" fill="#94a3b8" font-size="9" text-anchor="middle">Apertura total a Porche Sur</text>

    <!-- 9. TRASTERO SURF / BICIS / SALA TÉCNICA -->
    <rect x="125" y="325" width="150" height="140" fill="#1e293b"/>
    <text x="200" y="380" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">TRASTERO &amp; TÉCNICA</text>
    <text x="200" y="395" fill="#94a3b8" font-size="9" text-anchor="middle">8,2 m² · Acceso Zaguán</text>
    <text x="200" y="410" fill="#cbd5e1" font-size="8" text-anchor="middle">🏄 Bicis · Surf · Aerotermia</text>
    <text x="200" y="422" fill="#cbd5e1" font-size="8" text-anchor="middle">📶 Rack 19" · VMC Zehnder</text>
  </g>

  <!-- CAPA: COTAS Y TEXTOS NORTE -->
  <g id="textos-cotas-norte">
    <!-- Rosa de los vientos / Norte -->
    <g transform="translate(850, 120)">
      <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <polygon points="0,-24 7,-5 0,-10 -7,-5" fill="#ef4444"/>
      <polygon points="0,24 7,5 0,10 -7,5" fill="#64748b"/>
      <text x="0" y="-12" fill="#f8fafc" font-size="10" font-weight="900" text-anchor="middle">N</text>
      <text x="0" y="38" fill="#64748b" font-size="8" font-weight="600" text-anchor="middle">NORTE</text>
      <!-- Indicación viento Nordés -->
      <path d="M 22 -22 L 8 -8" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2"/>
      <text x="28" y="-25" fill="#38bdf8" font-size="7">Nordés (NE)</text>
    </g>

    <!-- Cartela Informativa Oficial -->
    <rect x="40" y="720" width="840" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="60" y="742" fill="#38bdf8" font-size="12" font-weight="700">PROPUESTA D — PABELLÓN BIOCLIMÁTICO ATLÁNTICO (OLEIROS EVOLUCIÓN)</text>
    <text x="60" y="760" fill="#94a3b8" font-size="10">PLANTA BAJA (Cota ±0,00 m) · Escala 1:100 (1m = 40px) · Huella PB cerrada: 116,5 m² (Cumple 20% PXOM Oleiros) · Zaguán Mudroom + Porche Sur 3,00m</text>
    <text x="60" y="774" fill="#10b981" font-size="9" font-weight="600">✓ 100% Legal PXOM y NHG Galicia · Despacho Sanctasanctórum con ventana Norte · Claustro verde a cielo abierto · Cero riesgo goteras/radón</text>
  </g>
</svg>

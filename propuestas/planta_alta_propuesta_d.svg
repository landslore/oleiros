<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 820" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <pattern id="grid-p1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <pattern id="wood-balcon" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#78350f" opacity="0.15"/>
      <line x1="0" y1="5" x2="20" y2="5" stroke="#b45309" stroke-width="1" opacity="0.3"/>
      <line x1="0" y1="15" x2="20" y2="15" stroke="#b45309" stroke-width="1" opacity="0.3"/>
    </pattern>
    <filter id="shadow-p1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- CUADRÍCULA DE FONDO (1m = 40px) -->
  <rect width="100%" height="100%" fill="url(#grid-p1)" />

  <!-- HUECO DEL CLAUSTRO CENTRAL (VISTAS CENITALES AL PATIO INFERIOR) -->
  <g id="hueco-claustro">
    <rect x="440" y="220" width="160" height="160" fill="#022c22" stroke="#10b981" stroke-width="2" stroke-dasharray="6 3"/>
    <circle cx="520" cy="300" r="30" fill="#047857" opacity="0.3"/>
    <circle cx="520" cy="300" r="14" fill="#f43f5e" opacity="0.6"/>
    <text x="520" y="295" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">HUECO CLAUSTRO</text>
    <text x="520" y="312" fill="#94a3b8" font-size="9" text-anchor="middle">Vistas a copa del Arce</text>
  </g>

  <!-- CUBIERTAS TÉCNICAS INFERIORES EN PB (PÉRGOLA Y TRASTERO) -->
  <g id="cubiertas-bajas" opacity="0.4">
    <rect x="120" y="80" width="160" height="390" fill="#1e293b" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="200" y="260" fill="#64748b" font-size="11" font-weight="600" text-anchor="middle">Cubierta Plana Pérgola/Técnica</text>
    <text x="200" y="278" fill="#38bdf8" font-size="9" text-anchor="middle">☀️ 10 Paneles Solares FV (4,5 kWp)</text>
  </g>

  <!-- CAPA: BALCÓN CORRIDO SUR P1 -->
  <g id="balcon-sur-p1">
    <rect x="280" y="500" width="480" height="60" fill="url(#wood-balcon)" stroke="#38bdf8" stroke-width="2"/>
    <!-- Peto de Vidrio de Seguridad Estructural -->
    <line x1="280" y1="560" x2="760" y2="560" stroke="#0ea5e9" stroke-width="3"/>
    <text x="520" y="535" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">BALCÓN CORRIDO SUR (14,0 m²) · BARANDILLA DE VIDRIO ESTRUCTURAL</text>
  </g>

  <!-- CAPA: MUROS EXTERIORES PLANTA PRIMERA -->
  <g id="muros-exteriores-p1" filter="url(#shadow-p1)">
    <path d="
      M 280 180 
      L 760 180 
      L 760 500 
      L 280 500 
      Z" 
      fill="#1e293b" stroke="#0ea5e9" stroke-width="3"/>
    
    <!-- Hueco central del claustro -->
    <rect x="440" y="220" width="160" height="160" fill="#0f172a" stroke="#0ea5e9" stroke-width="2.5"/>
  </g>

  <!-- CAPA: TABIQUERÍA INTERIOR P1 -->
  <g id="tabiqueria-interior-p1">
    <!-- Muro separador Baño Hijos / Galería -->
    <line x1="440" y1="180" x2="440" y2="220" stroke="#475569" stroke-width="4"/>
    <!-- Muro separador Dormitorio Niña / Niño -->
    <line x1="440" y1="380" x2="440" y2="500" stroke="#475569" stroke-width="5"/>
    <!-- Muro separador Dormitorio Niño / Suite -->
    <line x1="600" y1="380" x2="600" y2="500" stroke="#475569" stroke-width="5"/>
    <!-- Muro separador Suite Dormitorio / Vestidor -->
    <line x1="600" y1="340" x2="760" y2="340" stroke="#475569" stroke-width="4"/>
    <!-- Muro separador Vestidor / Baño Suite -->
    <line x1="600" y1="240" x2="760" y2="240" stroke="#475569" stroke-width="4"/>
  </g>

  <!-- CAPA: CARPINTERÍAS ACÚSTICAS Y BALCONERAS -->
  <g id="carpinterias-p1">
    <!-- Cerramiento Acristalado Acústico sobre el Claustro (4+4 Silence) -->
    <line x1="440" y1="380" x2="600" y2="380" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 2"/>
    <text x="520" y="375" fill="#38bdf8" font-size="7" font-weight="600" text-anchor="middle">Mampara Acústica 4+4 Silence (Corta ruidos PB)</text>

    <!-- Balconeras correderas al Balcón Sur -->
    <line x1="300" y1="500" x2="420" y2="500" stroke="#38bdf8" stroke-width="4"/>
    <line x1="460" y1="500" x2="580" y2="500" stroke="#38bdf8" stroke-width="4"/>
    <line x1="620" y1="500" x2="740" y2="500" stroke="#38bdf8" stroke-width="4"/>
  </g>

  <!-- CAPA: ESTANCIAS Y MOBILIARIO PLANTA PRIMERA -->
  <g id="mobiliario-p1">
    <!-- 1. DESEMBARCO DE ESCALERA Y PASILLO GALERÍA -->
    <g id="desembarco-escalera">
      <rect x="360" y="220" width="75" height="155" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <line x1="360" y1="235" x2="435" y2="235" stroke="#475569" stroke-width="1"/>
      <line x1="360" y1="250" x2="435" y2="250" stroke="#475569" stroke-width="1"/>
      <line x1="360" y1="265" x2="435" y2="265" stroke="#475569" stroke-width="1"/>
      <line x1="360" y1="280" x2="435" y2="280" stroke="#475569" stroke-width="1"/>
      <line x1="360" y1="295" x2="435" y2="295" stroke="#475569" stroke-width="1"/>
      <line x1="360" y1="310" x2="435" y2="310" stroke="#475569" stroke-width="1"/>
      <line x1="360" y1="325" x2="435" y2="325" stroke="#475569" stroke-width="1"/>
      <line x1="360" y1="340" x2="435" y2="340" stroke="#475569" stroke-width="1"/>
      <line x1="360" y1="355" x2="435" y2="355" stroke="#475569" stroke-width="1"/>
      <!-- Llegada cota +3,15m -->
      <circle cx="397" cy="365" r="5" fill="#10b981"/>
      <text x="397" y="375" fill="#10b981" font-size="8" font-weight="700" text-anchor="middle">+3,15 m</text>
    </g>

    <!-- Galería Pasillo Superior -->
    <rect x="440" y="380" width="160" height="40" fill="#0f172a"/>
    <text x="520" y="405" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">GALERÍA SUPERIOR (8,2 m²)</text>
    <text x="520" y="415" fill="#94a3b8" font-size="7" text-anchor="middle">Balizas nocturnas a 25 cm</text>

    <!-- 2. BAÑO COMPARTIDO HIJOS (NORTE) -->
    <rect x="285" y="185" width="150" height="90" fill="#0c4a6e" opacity="0.2"/>
    <!-- Bañera / Ducha amplia -->
    <rect x="290" y="190" width="65" height="35" rx="3" fill="#0284c7" opacity="0.4"/>
    <text x="322" y="212" fill="#ffffff" font-size="8" text-anchor="middle">Bañera</text>
    <!-- Doble seno integrado -->
    <rect x="370" y="190" width="60" height="20" rx="3" fill="#e2e8f0"/>
    <circle cx="385" cy="200" r="6" fill="#94a3b8"/>
    <circle cx="415" cy="200" r="6" fill="#94a3b8"/>
    <!-- Inodoro -->
    <rect x="375" y="225" width="20" height="25" rx="4" fill="#e2e8f0"/>
    <!-- Toallero radiador -->
    <line x1="425" y1="225" x2="425" y2="250" stroke="#f43f5e" stroke-width="3"/>
    <text x="360" y="265" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">BAÑO HIJOS (6,8 m²)</text>
    <text x="360" y="276" fill="#94a3b8" font-size="8" text-anchor="middle">Doble lavabo + Toallero</text>

    <!-- 3. DORMITORIO NIÑA (SUR-OESTE) -->
    <rect x="285" y="385" width="150" height="110" fill="#0f172a"/>
    <!-- Cama 1,20 × 2,00 m -->
    <rect x="290" y="395" width="60" height="80" rx="4" fill="#334155" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="295" y="400" width="50" height="20" rx="2" fill="#475569"/>
    <!-- Escritorio en pared ESTE (a 90° sin reflejos) -->
    <rect x="405" y="415" width="30" height="75" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="395" cy="452" r="9" fill="#475569"/>
    <text x="420" y="457" fill="#38bdf8" font-size="8" font-weight="700" transform="rotate(-90 420 457)" text-anchor="middle">Mesa 1,80 m</text>
    <!-- Armario empotrado al Norte -->
    <rect x="360" y="385" width="75" height="18" fill="#475569"/>
    <text x="360" y="485" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">DORMITORIO NIÑA (14,6 m²)</text>
    <text x="360" y="495" fill="#10b981" font-size="8" text-anchor="middle">✓ Luz Este a 90° · Cero reflejos</text>

    <!-- 4. DORMITORIO NIÑO (SUR-CENTRO) -->
    <rect x="445" y="385" width="150" height="110" fill="#0f172a"/>
    <!-- Cama 1,20 × 2,00 m -->
    <rect x="450" y="395" width="60" height="80" rx="4" fill="#334155" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="455" y="400" width="50" height="20" rx="2" fill="#475569"/>
    <!-- Escritorio en pared ESTE (a 90° sin reflejos) -->
    <rect x="565" y="415" width="30" height="75" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="555" cy="452" r="9" fill="#475569"/>
    <text x="580" y="457" fill="#38bdf8" font-size="8" font-weight="700" transform="rotate(-90 580 457)" text-anchor="middle">Mesa 1,80 m</text>
    <!-- Armario empotrado al Norte -->
    <rect x="520" y="385" width="75" height="18" fill="#475569"/>
    <text x="520" y="485" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">DORMITORIO NIÑO (14,6 m²)</text>
    <text x="520" y="495" fill="#10b981" font-size="8" text-anchor="middle">✓ Luz Este a 90° · Cero reflejos</text>

    <!-- 5. SUITE PRINCIPAL MATRIMONIO (ALA ESTE) -->
    <!-- Baño Privado Suite (Norte) -->
    <rect x="605" y="185" width="150" height="50" fill="#0c4a6e" opacity="0.2"/>
    <rect x="615" y="190" width="50" height="18" rx="2" fill="#e2e8f0"/>
    <text x="640" y="202" fill="#0f172a" font-size="7" text-anchor="middle">Doble Seno</text>
    <rect x="695" y="188" width="55" height="35" rx="3" fill="#0284c7" opacity="0.4"/>
    <text x="722" y="208" fill="#ffffff" font-size="8" text-anchor="middle">Ducha Doble</text>
    <text x="680" y="230" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">BAÑO SUITE (6,3 m²)</text>

    <!-- Vestidor de Paso Suite (Centro) -->
    <rect x="605" y="245" width="150" height="90" fill="#1e293b"/>
    <!-- Armarios a ambos lados -->
    <rect x="605" y="245" width="18" height="90" fill="#475569"/>
    <rect x="737" y="245" width="18" height="90" fill="#475569"/>
    <text x="675" y="295" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">VESTIDOR (8,4 m²)</text>
    <text x="675" y="310" fill="#94a3b8" font-size="8" text-anchor="middle">Módulos con LED interior</text>

    <!-- Dormitorio Suite Matrimonio (Sur) -->
    <rect x="605" y="345" width="150" height="150" fill="#0f172a"/>
    <!-- Cama King Size 1,80 × 2,00 m -->
    <rect x="635" y="365" width="85" height="85" rx="5" fill="#334155" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="640" y="370" width="35" height="20" rx="2" fill="#475569"/>
    <rect x="680" y="370" width="35" height="20" rx="2" fill="#475569"/>
    <!-- Mesillas de noche suspendidas -->
    <rect x="615" y="375" width="15" height="25" fill="#475569"/>
    <rect x="725" y="375" width="15" height="25" fill="#475569"/>
    <text x="680" y="475" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">SUITE MATRIMONIO</text>
    <text x="680" y="490" fill="#94a3b8" font-size="9" text-anchor="middle">16,5 m² · Salida directa Balcón Sur</text>
  </g>

  <!-- CARTELA TÉCNICA PLANTA PRIMERA -->
  <g id="cartela-p1">
    <rect x="40" y="720" width="840" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="60" y="742" fill="#38bdf8" font-size="12" font-weight="700">PROPUESTA D — PABELLÓN BIOCLIMÁTICO ATLÁNTICO (OLEIROS EVOLUCIÓN)</text>
    <text x="60" y="760" fill="#94a3b8" font-size="10">PLANTA PRIMERA (Cota +3,15 m) · Escala 1:100 (1m = 40px) · Superficie Útil P1: 78,5 m² + 14,0 m² Balcón Corrido Sur</text>
    <text x="60" y="774" fill="#10b981" font-size="9" font-weight="600">✓ Galería acristalada acústica (cero ruidos de PB a dormitorios) · Puestos de estudio a 90° sin deslumbramiento · Suite aislada al Este</text>
  </g>
</svg>
